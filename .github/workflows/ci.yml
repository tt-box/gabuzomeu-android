name: CI

# Le projet n'avait aucune intégration continue. Le build Maven d'origine n'était de
# toute façon plus reproductible : le dépôt de plugins Jayway est mort et deux
# dépendances devaient être installées à la main.
on:
  push:
    # Les branches de travail sont validées dès la poussée, sans attendre la PR.
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

# Jeton en lecture seule par défaut : seuls les jobs qui en ont besoin élargissent leurs
# droits (le job `build` ajoute `id-token: write` pour Codecov). Sans cette clé, les jobs
# héritaient des droits par défaut du dépôt, potentiellement en écriture.
permissions:
  contents: read

# Sur une branche de travail ou une PR, seul le dernier push compte : on annule le run
# précédent. Sur main en revanche, chaque fusion doit être validée pour elle-même —
# deux fusions rapprochées ne doivent pas annuler la CI de la première.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Les actions sont toutes sur le runtime Node 24 (Node 20 est déprécié) : checkout v7,
# setup-java v6, upload-artifact v7.
#
# Chaque `uses:` est épinglé sur le SHA complet du commit, la version lisible en
# commentaire : une étiquette (`v5`) est déplaçable, et ces actions s'exécutent avec le
# jeton du workflow — voire, dans release.yml, à côté des secrets de signature.
# Dependabot (écosystème github-actions) sait mettre à jour ces SHA et leur commentaire.
#
# `gradle/actions` s'arrête volontairement à **v5**, et ce n'est pas un oubli. La v6
# extrait le cache dans un composant `gradle-actions-caching` **propriétaire**, régi par
# les conditions commerciales de Gradle et non plus par la licence MIT, et elle **retire
# le support du cache de configuration** — que ce projet active
# (`org.gradle.configuration-cache=true` dans gradle.properties). Passer en v6 relève
# donc d'une décision de licence, pas d'une montée de version de routine.
#
# Cache de configuration Gradle : setup-gradle ne le sauvegarde que s'il peut le
# chiffrer (il peut contenir des valeurs sensibles), d'où `cache-encryption-key` sur
# chaque job Gradle. Sans le secret GRADLE_ENCRYPTION_KEY (PR Dependabot ou forks, qui
# n'y ont pas accès), le job tourne normalement, simplement sans ce cache.
#
# Chaque job a un `timeout-minutes` : sans lui, un émulateur ou un démon Gradle bloqué
# consommerait jusqu'à 6 h de runner.
jobs:
  # Un commit qui ne touche que la documentation n'a pas à relancer Gradle ni
  # l'émulateur. On ne peut pas filtrer au niveau du workflow (`paths-ignore`) : les
  # jobs sont des checks requis par la protection de main, et un workflow non déclenché
  # laisserait la PR bloquée en « attente ». Un job sauté par `if:`, lui, compte comme
  # réussi. Tout commit qui touche autre chose que la doc lance la CI complète, de même
  # qu'un déclenchement manuel ou une comparaison impossible (première poussée d'une
  # branche).
  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Le commit touche-t-il autre chose que la documentation ?
        id: diff
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$BASE_PR" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! files="$(git diff --name-only "$base...$GITHUB_SHA" 2>/dev/null)"; then
            echo "Pas de base de comparaison : CI complète."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          # Documentation : docs/, tout *.md, licences, cartes graft.
          if echo "$files" | grep -qvE '^(docs/|graft/|COPYING)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Documentation seule : build et tests sautés."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # La logique métier ne dépend pas d'Android : ses tests tournent en quelques
  # secondes et échouent vite. On les isole donc du reste.
  core:
    name: Logique métier (JVM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Garde-fou des fins de ligne : tout fichier commité doit déjà être dans la forme
      # imposée par .gitattributes. Sinon il apparaîtrait « modifié » au checkout sous
      # Windows (cas de gradlew.bat commité en CRLF par la mise à jour du wrapper).
      - name: Fins de ligne conformes à .gitattributes
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Fins de ligne non normalisées : $(git diff --cached --name-only | tr '\n' ' ')"
            echo "Corriger avec : git add --renormalize . && git commit"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Tests de :core:shadok et :core:eval
        run: ./gradlew :core:shadok:test :core:eval:test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapports-tests-core
          path: core/*/build/reports/tests/

  build:
    name: Build, lint et style
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Jeton OIDC pour Codecov : pas de secret à gérer, y compris sur les PR Dependabot.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Vérification du formatage
        run: ./gradlew spotlessCheck

      - name: Analyse statique
        run: ./gradlew detekt

      - name: Build complet, lint et tests unitaires
        # `build` enchaîne assemble + lint (en warningsAsErrors) + test.
        run: ./gradlew build

      # Les tests viennent de tourner sous instrumentation Kover : le rapport agrégé
      # (racine) ne fait que relire leurs résultats.
      - name: Rapport de couverture
        run: ./gradlew koverXmlReport

      # Badge SVG calculé ici, sans service externe (même script que zapette) ; publié
      # sur la branche `badges` par le job coverage-badge, sur main uniquement.
      - name: Badge de couverture
        run: bash scripts/coverage-badge.sh build/reports/kover/report.xml coverage.svg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build/reports/kover/
            coverage.svg
          if-no-files-found: error
          retention-days: 14

      # Un incident chez Codecov ne doit pas rendre la CI rouge — et donc bloquer
      # l'auto-merge des PR Dependabot.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: build/reports/kover/report.xml
          fail_ci_if_error: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapports-lint
          path: |
            app/build/reports/
            widget/build/reports/

      - name: APK release (non signé, vérifie que R8 ne casse rien)
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk

  # Publie le badge de couverture sur la branche orpheline `badges` (main est protégée :
  # le jeton de la CI ne peut pas y pousser). Job séparé : seul lui écrit, et il
  # n'exécute aucun code du projet. Commit seulement si le badge change.
  coverage-badge:
    name: Publication du badge de couverture
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage

      - name: Publier coverage.svg sur la branche badges
        env:
          BADGE: ${{ runner.temp }}/coverage/coverage.svg
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q -b badges badges && cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git ls-remote --exit-code --heads origin badges >/dev/null; then
              git fetch -q --depth=1 origin badges
              git reset -q --soft FETCH_HEAD
              git checkout -q FETCH_HEAD -- .
            fi
            cp "$BADGE" coverage.svg
            git add coverage.svg
            if git diff --cached --quiet; then echo "Couverture inchangée."; exit 0; fi
            git commit -q -m "badge: couverture"
            git push -q origin HEAD:badges && { echo "Badge publié."; exit 0; }
            sleep 5
          done
          echo "::error::Impossible de publier le badge de couverture"
          exit 1

  instrumentation:
    name: Tests instrumentés (émulateur API 31)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # L'accélération matérielle KVM est nécessaire pour que l'émulateur soit utilisable.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD et snapshot de démarrage en cache : sans lui, chaque run retélécharge l'image
      # système et démarre l'émulateur à froid (plusieurs minutes). Recette documentée
      # par android-emulator-runner. La clé porte la configuration de l'AVD : en changer
      # (niveau d'API, cible, architecture) produit un nouveau cache.
      - name: Cache de l'AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-google_apis-x86_64-v1

      # Premier run (cache absent) : on crée l'AVD et on sauvegarde un snapshot à chaud.
      - name: Créer l'AVD et son snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot de l'AVD généré."

      # Les runs suivants démarrent depuis le snapshot, sans jamais le réécrire : le
      # cache reste celui d'un émulateur propre.
      - name: Tests Compose et widget sur émulateur
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 31 : notre minSdk, le plancher qu'il faut vérifier.
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapports-tests-instrumentes
          path: app/build/reports/androidTests/
