name: Release

# Le tag est l'unique déclencheur : `git tag 1.2.3 && git push origin 1.2.3` suffit,
# le workflow construit, signe, puis crée lui-même la release GitHub. Inutile (et à
# éviter) de créer la release à la main depuis l'interface : on aurait deux auteurs
# pour une même release.
# Le préfixe « v » est facultatif et un suffixe de pré-version (`2.0.0-RC0`) est accepté.
#
# `workflow_dispatch` ne sert qu'à la reprise : relancer la publication d'un tag existant.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: "Tag à publier (ex. 2.0.0-RC0, ou v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

# Filet de sécurité : si un même tag déclenchait deux fois le workflow, deux exécutions
# téléverseraient les mêmes fichiers sur la même release. On les sérialise, sans jamais
# annuler celle en cours : interrompue en plein téléversement, une release resterait à
# moitié publiée (artefacts manquants ou fichier d'empreintes incohérent).
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# Actions sur le runtime Node 24. `gradle/actions` reste en v5 délibérément : voir la
# note de ci.yml — la v6 rend le cache propriétaire et supprime le cache de configuration.
# Toutes les actions sont épinglées par SHA de commit (voir ci.yml) : ici plus qu'ailleurs,
# elles côtoient les secrets de signature et un jeton `contents: write`.
jobs:
  release:
    name: Construire et publier
    runs-on: ubuntu-latest
    env:
      # Empreinte SHA-256 du certificat de release (ECDSA P-256, alias gabuzomeu-release).
      # Publique par nature : elle épingle la clé attendue, de sorte qu'un secret
      # remplacé par erreur (ou malveillance) fasse échouer la release au lieu de
      # publier un APK signé par une autre clé — que les utilisateurs ne pourraient
      # d'ailleurs pas installer par-dessus la version existante.
      # En cas de rotation de clé, mettre à jour cette valeur.
      EXPECTED_CERT_SHA256: c955b10cf9dab437a8d9c1aa81d83b97dc79e3ca22fde903c47817e5fe22aefc
    steps:
      # Une release sert à distribuer : un APK non signé ne s'installe pas. On échoue
      # avant toute compilation plutôt que de publier des artefacts inutilisables.
      - name: Vérifier la présence des secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets de signature manquants :$missing (voir README, section Signature)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet et tous les tags : l'étape « Déterminer la version »
          # vérifie que le tag demandé existe bien et que c'est lui qui est extrait.
          fetch-depth: 0
          # En reprise manuelle, `github.ref` est la branche : on force le tag demandé,
          # sinon on construirait la pointe de main et non la version publiée.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Déterminer la version
        id: version
        env:
          # `push` porte le tag dans la réf, `workflow_dispatch` dans son entrée.
          INPUT_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # En reprise manuelle, l'entrée est libre : on refuse tout ce qui n'est pas un
          # tag de version existant (une branche, un SHA, une faute de frappe…). Sinon on
          # signerait et publierait n'importe quel commit sous un nom de version.
          # Forme attendue : [v]MAJEUR.MINEUR.PATCH, suivi d'un suffixe facultatif.
          SEMVER_RE='^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$'
          if ! [[ "$TAG" =~ $SEMVER_RE ]]; then
            echo "::error::« $TAG » n'est pas un tag de version (attendu : 1.2.3, v1.2.3 ou 1.2.3-RC1)"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          PRE="${BASH_REMATCH[5]}"
          if ! TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")"; then
            echo "::error::Le tag $TAG n'existe pas dans le dépôt"
            exit 1
          fi
          # Le checkout a dû extraire exactement ce tag (et non une branche homonyme).
          if [ "$(git rev-parse HEAD)" != "$TAG_COMMIT" ]; then
            echo "::error::HEAD ($(git rev-parse HEAD)) ne correspond pas au tag $TAG ($TAG_COMMIT)"
            exit 1
          fi
          # Le « v » n'est qu'une convention de nommage du tag : v1.2.3 -> 1.2.3.
          # Un suffixe de pré-version, lui, est conservé : « 2.0.0-RC0 » est un
          # versionName parfaitement valide, et c'est une information utile.
          VERSION="${TAG#v}"
          # Un suffixe après le patch (« -RC1 », « -beta.2 ») désigne une pré-version,
          # comme en versionnage sémantique. Sans ce calcul, un tag de candidate
          # apparaissait comme une release définitive, seule à être proposée en
          # « Latest » sur la page du dépôt.
          if [ -n "$PRE" ]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          # versionCode dérivé du tag, et non plus du nombre de commits : une candidate et
          # la version définitive posées sur le même commit recevaient le même code, et
          # Android refuse alors la mise à jour. Correspondance :
          #   MAJEUR*1 000 000 + MINEUR*10 000 + PATCH*100 + RANG
          #   RANG = numéro de pré-version (0 à 98 : « RC0 » -> 0, « beta.3 » -> 3),
          #          99 pour la version définitive, qui passe ainsi après ses candidates.
          #   ex. 2.0.0-RC6 -> 2000006, 2.0.0 -> 2000099, 2.1.3-RC2 -> 2010302.
          # Seul le numéro compte, pas le libellé : numéroter les pré-versions d'une même
          # version de façon croissante (beta.1, beta.2, RC3…) plutôt que beta.1 puis RC1.
          # Ces codes (≥ 1 000 000) dépassent largement les anciens, issus du nombre de
          # commits (~70) : les installations existantes se mettent à jour sans encombre.
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ] || [ "$MAJOR" -gt 2099 ]; then
            echo "::error::$TAG hors des bornes du versionCode (mineur et patch ≤ 99, majeur ≤ 2099)"
            exit 1
          fi
          if [ -z "$PRE" ]; then
            RANK=99
          elif [[ "$PRE" =~ ^[A-Za-z]*[.-]?([0-9]+)$ ]]; then
            RANK=$((10#${BASH_REMATCH[1]}))
            if [ "$RANK" -ge 99 ]; then
              echo "::error::Numéro de pré-version $RANK ≥ 99 dans $TAG : il se confondrait avec la version définitive"
              exit 1
            fi
          else
            echo "::error::Suffixe de pré-version « $PRE » non reconnu (attendu : RC1, beta.2, alpha-3…)"
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + RANK))
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "name=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG -> version $VERSION (versionCode $VERSION_CODE, prerelease $PRERELEASE)"

      # On ne publie jamais une version qui ne passe pas les tests.
      - name: Vérifications
        run: ./gradlew spotlessCheck detekt build

      - name: Restaurer le keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"

      - name: Construire l'AAB et l'APK signés
        env:
          GABUZOMEU_VERSION_NAME: ${{ steps.version.outputs.name }}
          GABUZOMEU_VERSION_CODE: ${{ steps.version.outputs.code }}
          GABUZOMEU_STORE_FILE: ${{ steps.keystore.outputs.path }}
          GABUZOMEU_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GABUZOMEU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GABUZOMEU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      # Le keystore n'a plus d'usage : on ne le laisse pas traîner sur le runner.
      - name: Effacer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      # Contrôle indépendant de Gradle : l'APK doit être signé, vérifiable par Android,
      # et par le certificat épinglé ci-dessus. Idem pour l'AAB (signature JAR).
      - name: Vérifier la signature des artefacts
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          aabs=(app/build/outputs/bundle/release/*.aab)
          [ ${#apks[@]} -gt 0 ] && [ ${#aabs[@]} -gt 0 ] || { echo "::error::Artefacts introuvables"; exit 1; }
          for apk in "${apks[@]}"; do
            case "$apk" in *-unsigned.apk) echo "::error::APK non signé : $apk"; exit 1 ;; esac
            out="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
            echo "$out" | grep -E "^Verified using|certificate DN|certificate SHA-256|key algorithm|key size"
            actual="$(echo "$out" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::$apk signé par $actual, attendu $EXPECTED_CERT_SHA256"; exit 1; }
          done
          for aab in "${aabs[@]}"; do
            actual="$(keytool -printcert -jarfile "$aab" | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
            [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::$aab signé par '$actual', attendu $EXPECTED_CERT_SHA256"; exit 1; }
            echo "$aab : certificat $actual"
          done

      # Noms explicites dans la release : « app-release.apk » ne dit ni quoi ni quelle
      # version. Les artefacts signés sont mis à l'abri dans dist/ : le build non signé
      # qui suit réécrit le répertoire de sortie de Gradle.
      - name: Rassembler les artefacts signés
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          mv app/build/outputs/apk/release/app-release.apk "dist/gabuzomeu-$VERSION.apk"
          mv app/build/outputs/bundle/release/app-release.aab "dist/gabuzomeu-$VERSION.aab"

      # APK non signé, pour qui veut le signer avec sa propre clé (F-Droid, builds
      # reproductibles, distribution interne). Mêmes sources et même version : seule la
      # signature diffère. Sans les variables GABUZOMEU_STORE_*, la configuration de
      # signature release est absente (voir app/build.gradle.kts).
      - name: Construire l'APK non signé
        env:
          GABUZOMEU_VERSION_NAME: ${{ steps.version.outputs.name }}
          GABUZOMEU_VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$apk" ] || { echo "::error::APK non signé introuvable : $apk"; exit 1; }
          # Garde-fou : un APK « unsigned » qui porterait une signature serait trompeur.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
            echo "::error::$apk porte une signature"; exit 1
          fi
          mv "$apk" "dist/gabuzomeu-$VERSION-unsigned.apk"

      - name: Empreintes SHA-256
        env:
          VERSION: ${{ steps.version.outputs.name }}
        working-directory: dist
        run: |
          sha256sum *.apk *.aab > "gabuzomeu-$VERSION.sha256"
          cat "gabuzomeu-$VERSION.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gabuzomeu-${{ steps.version.outputs.name }}
          path: dist/*

      - name: Publier les artefacts sur la release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Explicite : en reprise manuelle, `github.ref` est une branche et l'action
          # publierait sur une pseudo-release nommée d'après elle.
          tag_name: ${{ steps.version.outputs.tag }}
          name: GaBuZoMeu ${{ steps.version.outputs.name }}
          # Une candidate ne doit pas s'annoncer comme la version stable du dépôt.
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          # Une release sans APK est précisément le symptôme à ne plus jamais laisser
          # passer en silence : si un glob ne trouve rien, le job échoue.
          fail_on_unmatched_files: true
          files: |
            dist/gabuzomeu-*.aab
            dist/gabuzomeu-*.apk
            dist/gabuzomeu-*.sha256
